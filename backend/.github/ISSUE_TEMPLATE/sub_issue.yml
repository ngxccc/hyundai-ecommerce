name: "Sub-Issue / Tracer-Bullet Task"
description: "Create a child ticket decomposing a parent Epic/Feature"
title: "<type>(<area>): <summary>"
labels: ["status:triage"]
body:
  - type: textarea
    id: parent
    attributes:
      label: "Parent Epic / Feature Reference"
      description: "Reference the parent issue number (e.g. Ref: #79)"
      placeholder: "Ref: #79"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "What to Build / Slice Scope"
      description: "Concrete step-by-step implementation changes"
      placeholder: |
        1. Implement X in `src/...`
        2. Add unit tests in `src/...`
        3. Verify integration tests
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Invariants & Acceptance Criteria"
      placeholder: |
        - [ ] Satisfies INV-1: ...
        - [ ] All unit and integration test suites pass (`bun test`).
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies & Execution Order"
      placeholder: |
        - **Blocked by**: #82 (Foundation)
        - **Blocks**: #84 (Next Slice)
    validations:
      required: false
