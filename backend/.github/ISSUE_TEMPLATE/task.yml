name: "Technical Task / Maintenance"
description: "Propose code refactoring, test suite enhancement, performance tuning, or maintenance chore"
title: "<type>(<area>): <summary>"
labels: ["status:triage"]
body:
  - type: textarea
    id: goal
    attributes:
      label: "Task Goal & Motivation"
      description: "Why is this refactoring needed? What technical debt does it address?"
      placeholder: "Adopt Test Factory pattern, eliminate duplicate queries..."
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: "Task Type"
      options:
        - "type:refactor (Internal code restructuring)"
        - "type:test (Adding/updating test coverage)"
        - "type:perf (Performance optimization)"
        - "type:chore (Build, dependencies, or tooling)"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Affected Components & Files"
      placeholder: "Target files: src/modules/..., test/integration/..."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] All tests pass cleanly (`bun test`)
        - [ ] Typecheck passes with 0 errors (`tsc --noEmit`)
        - [ ] Linter passes with 0 warnings (`bun run lint`)
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies & Execution Order"
      description: "Specify if this task is blocked by or blocks other issues"
      placeholder: |
        - **Blocked by**: #82
        - **Blocks**: #84
    validations:
      required: false
