# .github/labeler.yml - Automatic PR labeling based on modified file paths (v5 schema)
"area:storefront":
  - changed-files:
      - any-glob-to-any-file:
          - "storefront/**/*"

"area:admin":
  - changed-files:
      - any-glob-to-any-file:
          - "admin/**/*"

"area:backend":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**/*"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"

"area:harness":
  - changed-files:
      - any-glob-to-any-file:
          - ".claude/skills/**/*"
          - ".omp/**/*"
          - "AGENTS.md"
          - "CLAUDE.md"
          - "CONTEXT.md"
          - "docs/**/*"

"type:test":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/*.spec.ts"

"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
          - "**/*.md"
