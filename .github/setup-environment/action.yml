name: Setup Monorepo Environment
description: Bootstraps Bun and dependencies
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
      with:
        bun-version: latest

    - name: Cache Bun Dependencies
      uses: ./.github/cache
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.0

    - name: Install Dependencies
      run: bun install --frozen-lockfile
      shell: bash
