name: Quality Gate & Test Suite

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  integration:
    name: "Build, Lint & Test Pipeline"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Backend Quality Gate
        working-directory: backend
        run: |
          bun install
          bun run check-types
          bun run lint
          bun test src/
          bun run build
      - name: Storefront Quality Gate
        working-directory: storefront
        run: |
          bun install
          bun run check-types

      - name: Admin Quality Gate
        working-directory: admin
        run: |
          bun install
          bun run check-types
          bun test
