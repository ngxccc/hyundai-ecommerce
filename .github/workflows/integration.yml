name: Monorepo Quality Gate & Test Suite

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  integration:
    name: "Build, Lint & Test Pipeline"
    runs-on: ubuntu-latest
    environment: Staging
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING || secrets.DOPPLER_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Migrate Test Database
        working-directory: packages/database
        run: bun run db:migrate

      - name: Run Monorepo Pipeline
        run: bun turbo run lint check-types test test:integration build
