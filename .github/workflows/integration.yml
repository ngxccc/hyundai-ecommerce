name: Quality Gate & Test Suite

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  quality-gate:
    name: "${{ matrix.app.name }} Quality Gate"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: "Backend"
            dir: "backend"
          - name: "Storefront"
            dir: "storefront"
          - name: "Admin"
            dir: "admin"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Type-Check
        working-directory: ${{ matrix.app.dir }}
        run: bun run check-types

      - name: Lint Code
        working-directory: ${{ matrix.app.dir }}
        run: bun run lint

      - name: Run Test Suite
        working-directory: ${{ matrix.app.dir }}
        run: bun run test

      - name: Production Build
        working-directory: ${{ matrix.app.dir }}
        run: bun run build
