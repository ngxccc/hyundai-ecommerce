name: Backend App CD

on:
  push:
    branches: ["main"]
    paths:
      - "backend/src/**"
      - "!backend/src/database/seeds/**"
      - "backend/drizzle/**"
      - "backend/package.json"
      - "backend/bun.lock"
      - "backend/tsconfig.json"
      - "backend/nest-cli.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger via GitHub Actions"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Verify & Release to Render
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Type-Check
        working-directory: backend
        run: bun run check-types

      - name: Lint Code
        working-directory: backend
        run: bun run lint

      - name: Run Test Suite
        working-directory: backend
        run: bun run test

      - name: Production Build
        working-directory: backend
        run: bun run build

      - name: Run Database Migrations
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "Running database migrations via Doppler..."
            bun run db:migrate
          else
            echo "Notice: DOPPLER_TOKEN is not set. Skipping automated migration."
          fi

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Calling Render Deploy Hook..."
            curl -f -s -S -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered successfully."
          else
            echo "Notice: RENDER_DEPLOY_HOOK_URL is not set. Render will auto-deploy via GitHub push integration if enabled."
          fi
