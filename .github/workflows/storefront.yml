name: Storefront App CD

on:
  push:
    branches: ["main"]
    paths:
      - "storefront/app/**"
      - "storefront/src/**"
      - "storefront/messages/**"
      - "storefront/public/**"
      - "storefront/package.json"
      - "storefront/bun.lock"
      - "storefront/next.config.*"
      - "storefront/tsconfig.json"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual trigger via GitHub Actions"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Release to Vercel
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Type-Check
        working-directory: storefront
        run: bun run check-types

      - name: Lint Code
        working-directory: storefront
        run: bun run lint

      - name: Run Test Suite
        working-directory: storefront
        run: bun run test

      - name: Deploy to Vercel
        uses: ./.github/vercel-deploy
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}
