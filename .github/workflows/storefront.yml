name: Storefront App CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.2
        id: filter
        with:
          filters: |
            storefront:
              - "apps/storefront/**"
              - "packages/database/**"
              - "packages/eslint-config/**"
              - "packages/shared/**"
              - "packages/core/**"
              - "packages/ui/**"
              - "packages/typescript-config/**"
              - ".github/setup-environment/**"
              - "turbo.json"
              - "bun.lock"
              - "package.json"
              - ".github/workflows/storefront.yml"

  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.storefront == 'true' }}
    name: Release to Vercel
    runs-on: ubuntu-latest
    environment: Production
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Environment
        uses: ./.github/setup-environment

      - name: Final Safety Check (Lint, Test)
        run: bun turbo run lint check-types test --filter=storefront
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Deploy to Vercel
        uses: ./.github/vercel-deploy
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Apply Expand Migration to Prod DB
        working-directory: packages/database
        run: bun run db:migrate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
