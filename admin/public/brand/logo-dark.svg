<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 115" width="100%" height="100%" fill="none">
  <!-- ================= SYMBOL MARK (Left: 100% Solid Flat Geometry Dark) ================= -->
  <g transform="translate(6, 8)">
    <!-- Ambient Ring Frame (Solid Flat Color) -->
    <circle cx="50" cy="50" r="48" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 3" />
    <circle cx="50" cy="50" r="45" stroke="#00A3E0" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Left Pillar of 'H' (Solid Pure White) -->
    <path d="M 28 22 
             C 28 22, 38 22, 40 32
             L 32 78 
             C 30 84, 22 84, 22 84 
             L 28 22 Z" 
          fill="#FFFFFF" />

    <!-- Right Pillar of 'H' (Solid Pure White) -->
    <path d="M 68 18 
             C 74 18, 78 22, 76 28
             L 66 72 
             C 64 82, 54 82, 54 82 
             L 68 18 Z" 
          fill="#FFFFFF" />

    <!-- Dynamic Energy Bolt (Solid Electric Cyan #00A3E0) -->
    <path d="M 28 54 
             L 52 38 
             L 46 50 
             L 72 46 
             L 48 68 
             L 54 56 
             Z" 
          fill="#00A3E0" />

    <!-- Energy Spark Accent (Solid Cyan Light) -->
    <circle cx="72" cy="46" r="3" fill="#38BDF8" />
    <circle cx="28" cy="54" r="2.5" fill="#0077C8" />
  </g>

  <!-- ================= WORDMARK (Right: 100% Solid Flat Dark Typography) ================= -->
  <g transform="translate(122, 22)">
    <!-- HYUNDAI (Solid Pure White #FFFFFF) -->
    <text x="0" y="36" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="32" 
          font-weight="900" 
          letter-spacing="4" 
          fill="#FFFFFF">
      HYUNDAI
    </text>

    <!-- NHẬT NĂNG (Solid Electric Cyan #00A3E0) -->
    <text x="195" y="36" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
          font-size="32" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="#00A3E0">
      NHẬT NĂNG
    </text>

    <!-- Subtitle / Brand Descriptor (Solid Slate) -->
    <g transform="translate(2, 58)">
      <!-- Badge pill -->
      <rect x="0" y="0" width="76" height="17" rx="3.5" fill="#00A3E0" />
      <text x="38" y="12" 
            text-anchor="middle"
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="8.5" 
            font-weight="800" 
            letter-spacing="1.5" 
            fill="#0F172A">
        OFFICIAL
      </text>

      <!-- Tagline -->
      <text x="86" y="12.5" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-size="10.5" 
            font-weight="700" 
            letter-spacing="2" 
            fill="#94A3B8">
        GENERATOR &amp; UPS POWER SOLUTIONS
      </text>
    </g>

    <!-- Technical Divider Line (Aligned with end of text) -->
    <line x1="0" y1="46" x2="410" y2="46" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="46" x2="160" y2="46" stroke="#00A3E0" stroke-width="2" />
  </g>
</svg>
